[package]
name = "waverunner-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "waverunner"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

waverunner-core = { workspace = true }
waverunner-proto = { workspace = true }
# The Brain: the daemon subscribes to the OPTIONS Context Core's context
# snapshots (see brain.rs — the S2 "Spine" wiring).
options-engine = { workspace = true }
# The notification OPTION talks to the options-notify daemon over session D-Bus;
# we depend on it only for the shared wire type (`ActiveNotification`).
options-notify = { workspace = true }
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }
futures-util = "0.3"

smithay-client-toolkit = { version = "0.19", features = ["calloop"] }
wayland-client = "0.31"
# wlr-screencopy: sample the top row of a maximized window so the OPTIONS
# bar can colour-match it (the smart-gaps "one surface" look).
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# client_system: back the connection with libwayland so we can hand raw
# wl_display/wl_surface pointers to wgpu.
wayland-backend = { version = "0.3", features = ["client_system"] }
calloop = "0.13"
calloop-wayland-source = "0.3"
wgpu = "24"
raw-window-handle = "0.6"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
freedesktop-icons = { workspace = true }
resvg = { workspace = true }
image = { workspace = true }
md5 = { workspace = true }
glyphon = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
