[package]
name = "waverunner-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "waverunner"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

waverunner-core = { workspace = true }
waverunner-proto = { workspace = true }

smithay-client-toolkit = "0.19"
wayland-client = "0.31"
# client_system: back the connection with libwayland so we can hand raw
# wl_display/wl_surface pointers to wgpu.
wayland-backend = { version = "0.3", features = ["client_system"] }
calloop = "0.14"
calloop-wayland-source = "0.4"
wgpu = "24"
raw-window-handle = "0.6"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
freedesktop-icons = { workspace = true }
resvg = { workspace = true }
glyphon = { workspace = true }
libc = { workspace = true }
