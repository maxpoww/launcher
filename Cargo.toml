[workspace]
resolver = "2"
members = [
    "crates/daemon",
    "crates/client",
    "crates/core",
    "crates/proto",
    "crates/options-engine",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nucleo-matcher = "0.3"
freedesktop-desktop-entry = "0.8"
freedesktop-icons = "0.4"
resvg = "0.47"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
md5 = "0.8"
glyphon = "0.8"
libc = "0.2"
serde_json = "1"

waverunner-core = { path = "crates/core" }
waverunner-proto = { path = "crates/proto" }
# The OPTIONS Context Core ("the Brain") — headless sensing engine the daemon
# subscribes to. Not yet consumed by the daemon; wired in a later step.
options-engine = { path = "crates/options-engine" }

[profile.release]
lto = "thin"
strip = true
